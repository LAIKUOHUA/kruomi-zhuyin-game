<html lang="zh-Hant">
<head>

  <title>酷洛米的注音魔法屋・簡易版</title>
  <style>
    :root{--ink:#37213e;--purple:#7c3aed;--deep:#4c1d95;--pink:#ff6fae;--cream:#fff9f1;--lav:#f1e9ff;--line:#dcccf1;--good:#2f9e75;--bad:#e25578;--shadow:0 16px 42px #4c1d9520}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,#ffd6e8 0 10%,transparent 28%),radial-gradient(circle at 90% 0,#dac8ff 0 12%,transparent 32%),linear-gradient(145deg,#fffaf2,#f2ebff);padding:18px}button{font:inherit;color:inherit}.app{max-width:1100px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-weight:1000;font-size:clamp(19px,4vw,27px);display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--ink);color:white;box-shadow:0 5px 0 #160d1a;font-size:26px}.score{background:white;border:2px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:900;white-space:nowrap}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:#fffdf9eF;border:2px solid #fff;border-radius:28px;box-shadow:var(--shadow)}.intro{padding:30px;position:relative;overflow:hidden}.eyebrow{font-size:13px;letter-spacing:.13em;color:var(--purple);font-weight:1000;margin:0 0 8px}.intro h1{font-size:clamp(30px,5vw,49px);line-height:1.15;margin:0 0 13px}.intro p{line-height:1.8;color:#725d79;margin:0 0 20px}.primary,.secondary,.sound,.answer,.level{border:0;cursor:pointer;transition:.16s}.primary{background:var(--ink);color:white;border-radius:17px;padding:14px 24px;font-weight:1000;box-shadow:0 6px 0 #190e1d}.primary:active,.sound:active,.answer:active{transform:translateY(4px);box-shadow:none}.spark{position:absolute;right:20px;bottom:5px;font-size:70px;opacity:.14}.character-card{padding:20px;text-align:center;background:linear-gradient(160deg,#f0e6ff,#fff5f9)}.character-card h2{font-size:20px;margin:0}.character-card p{color:#725d79;margin:6px 0 0;font-size:14px}.stage{height:230px;position:relative;display:grid;place-items:center;overflow:hidden}.shadow{position:absolute;bottom:15px;width:170px;height:24px;background:#6b3e881f;border-radius:50%}.kuromi{position:relative;width:145px;height:170px;z-index:1}.head{position:absolute;left:18px;top:43px;width:110px;height:100px;background:#fff;border:5px solid var(--ink);border-radius:48% 48% 43% 43%}.hood{position:absolute;left:6px;top:30px;width:134px;height:96px;background:var(--ink);border-radius:55% 55% 36% 36%}.ear{position:absolute;top:0;width:46px;height:94px;background:var(--ink);border-radius:80% 12% 52% 32%;transform-origin:bottom}.ear.left{left:5px;transform:rotate(-23deg)}.ear.right{right:5px;transform:scaleX(-1) rotate(-23deg)}.ear:after{content:"";position:absolute;width:16px;height:32px;background:#ee73ae;border-radius:50%;left:12px;top:17px}.face{position:absolute;z-index:2;left:34px;top:72px;width:78px;height:58px}.eyes{display:flex;justify-content:space-between;padding:7px 12px}.eye{width:10px;height:16px;background:var(--ink);border-radius:50%}.mouth{width:24px;height:11px;border-bottom:4px solid var(--ink);border-radius:50%;margin:0 auto}.skull{position:absolute;z-index:3;top:47px;left:58px;width:30px;height:24px;background:#f5c9dc;border-radius:50%;font-size:15px;line-height:24px}.body{position:absolute;z-index:0;left:37px;top:125px;width:72px;height:42px;background:var(--outfit,#4b2467);border-radius:18px 18px 28px 28px;border:4px solid var(--ink)}.skirt{display:none;position:absolute;z-index:2;left:25px;top:148px;width:96px;height:31px;background:var(--skirt,#ff73ad);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);border-radius:8px}.clip{display:none;position:absolute;z-index:5;right:24px;top:55px;font-size:29px;transform:rotate(13deg)}.held{position:absolute;right:-12px;bottom:15px;font-size:42px;z-index:4;filter:drop-shadow(0 4px 3px #4c1d9530)}.collection{margin-top:5px;font-size:13px;font-weight:900;color:var(--purple)}.map-title{display:flex;align-items:end;justify-content:space-between;margin:26px 3px 11px}.map-title h2{margin:0;font-size:23px}.map-title span{color:#7b6682;font-size:14px}.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}.level{min-height:67px;background:white;border:2px solid var(--line);border-radius:16px;padding:7px 3px;font-weight:900;color:#9b8aa2}.level b{display:block;font-size:22px}.level.done{background:#fff0f7;border-color:#ffacd1;color:#a62c64}.level.current{background:var(--lav);border-color:var(--purple);color:var(--deep);box-shadow:0 4px 0 var(--purple)}.level:disabled{cursor:not-allowed}.game{margin-top:20px;padding:27px;display:grid;grid-template-columns:.86fr 1.14fr;gap:28px}.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.tag{background:var(--lav);color:var(--deep);padding:7px 13px;border-radius:99px;font-weight:900;font-size:14px}.sound{margin:18px 0 11px;width:112px;height:112px;border-radius:50%;border:5px solid white;background:linear-gradient(145deg,var(--purple),var(--pink));color:white;font-size:44px;box-shadow:0 8px 0 var(--deep),0 12px 28px #7c3aed35}.sound.playing{animation:pulse .65s infinite alternate}.instruction{font-weight:900;font-size:18px;margin:5px}.progress{color:#836b89;font-size:14px;margin:4px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-content:center}.answer{min-height:104px;background:#fff;border:3px solid var(--line);border-radius:23px;font-size:clamp(31px,5vw,48px);font-weight:1000;box-shadow:0 6px 0 #c9b2e5}.answer:hover{background:#f8f2ff;border-color:#af8ee1}.answer.correct{background:#d9f7e9;border-color:#55b993;box-shadow:0 6px 0 #32916d}.answer.wrong{background:#ffe1e8;border-color:#ef7894;animation:shake .25s}.feedback{grid-column:1/-1;text-align:center;min-height:32px;font-size:18px;font-weight:1000}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.reward{display:none;text-align:center;padding:28px;margin-top:20px;background:linear-gradient(145deg,#fff5bd,#ffe5f0)}.reward.show{display:block}.gift{font-size:70px;animation:bounce .7s}.reward h2{margin:6px 0}.reward p{color:#705d76}.secondary{background:white;border:2px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:900}.closet{margin-top:20px;padding:24px}.closet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.closet h2{margin:0}.items{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.item{min-height:92px;border-radius:17px;background:#f5f0f7;border:2px dashed #d7c8df;display:grid;place-items:center;text-align:center;color:#9b8aa2;font-size:12px;font-weight:900;padding:7px}.item .icon{display:block;font-size:33px;filter:grayscale(1);opacity:.35}.item.unlocked{background:#fff7fb;border-style:solid;border-color:#f5aed0;color:#6e3760}.item.unlocked .icon{filter:none;opacity:1}.item.wearing{outline:3px solid var(--purple)}.reset{border:0;background:transparent;color:#947f9b;text-decoration:underline;cursor:pointer}.tip{font-size:13px;color:#8d7794;margin:17px 0 0;text-align:center}@keyframes pulse{to{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes bounce{50%{transform:translateY(-12px)}}@media(max-width:760px){body{padding:11px}.hero,.game{grid-template-columns:1fr}.intro{padding:24px}.levels{grid-template-columns:repeat(5,1fr)}.game{padding:20px;gap:13px}.answers{gap:8px}.answer{min-height:83px}.items{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.score{font-size:13px}.stage{height:210px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="logo">♠</span>酷洛米的注音魔法屋・簡易版</div><div class="score">⭐ <span id="stars">0</span> 顆魔法星</div></header>
  <section class="hero">
    <article class="card intro"><p class="eyebrow">ㄅㄆㄇ・EASY MODE</p><h1>聽一個注音，<br>找出一樣的符號！</h1><p>按喇叭會直接播放「ㄅ、ㄆ、ㄇ」等單一注音。聽完後選出相同符號，完成 10 關就能收集所有禮物！</p><button class="primary" id="startBtn">開始第 1 關 →</button><span class="spark">✦</span></article>
    <article class="card character-card"><h2>我的酷洛米</h2><p id="mood">今天也要酷酷地學注音！</p><div class="stage"><div class="shadow"></div><div class="kuromi" id="kuromi"><div class="ear left"></div><div class="ear right"></div><div class="hood"></div><div class="head"></div><div class="face"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div></div><div class="skull">☠</div><div class="body" id="body"></div><div class="skirt" id="skirt"></div><div class="clip" id="clip"></div><div class="held" id="held"></div></div></div><div class="collection" id="collectionText">尚未獲得禮物</div></article>
  </section>
  <div class="map-title"><h2>魔法冒險地圖</h2><span>每關答對 3 題</span></div>
  <nav class="levels" id="levels" aria-label="關卡選單"></nav>
  <section class="card game" id="game">
    <div class="prompt"><span class="tag" id="levelTag">第 1 關・聲音小森林</span><button class="sound" id="soundBtn" aria-label="播放題目注音">🔊</button><p class="instruction" id="instruction">按喇叭聽一個注音</p><p class="progress" id="progress">再選出一樣的符號</p></div>
    <div class="answers" id="answers"><div class="feedback">準備好就按「開始第 1 關」吧！</div></div>
  </section>
  <section class="card reward" id="reward"><div class="gift" id="gift">🎁</div><h2 id="rewardTitle">得到新禮物！</h2><p id="rewardText"></p><button class="secondary" id="nextBtn">前往下一關 →</button></section>
  <section class="card closet"><div class="closet-head"><h2>🎀 魔法衣櫃</h2><button class="reset" id="resetBtn">重新開始</button></div><div class="items" id="items"></div><p class="tip">點選已解鎖的衣服或配件，可以幫酷洛米換裝。</p></section>
</main>
<script>
const levels=[
 {name:'聲音小森林',questions:[['爸爸','ㄅ',['ㄅ','ㄆ','ㄇ']],['葡萄','ㄆ',['ㄅ','ㄆ','ㄈ']],['媽媽','ㄇ',['ㄇ','ㄋ','ㄌ']],['飛機','ㄈ',['ㄏ','ㄈ','ㄒ']]]},
 {name:'泡泡糖小徑',questions:[['大象','ㄉ',['ㄉ','ㄊ','ㄋ']],['兔子','ㄊ',['ㄊ','ㄉ','ㄎ']],['牛奶','ㄋ',['ㄋ','ㄌ','ㄖ']],['老虎','ㄌ',['ㄌ','ㄋ','ㄇ']]]},
 {name:'皇冠山谷',questions:[['哥哥','ㄍ',['ㄍ','ㄎ','ㄏ']],['恐龍','ㄎ',['ㄍ','ㄎ','ㄑ']],['花朵','ㄏ',['ㄏ','ㄈ','ㄒ']],['高興','ㄍ',['ㄍ','ㄐ','ㄏ']]]},
 {name:'星星遊樂園',questions:[['雞蛋','ㄐ',['ㄐ','ㄑ','ㄒ']],['氣球','ㄑ',['ㄐ','ㄑ','ㄒ']],['西瓜','ㄒ',['ㄒ','ㄕ','ㄙ']],['鉛筆','ㄑ',['ㄑ','ㄐ','ㄘ']]]},
 {name:'蝴蝶花園',questions:[['豬豬','ㄓ',['ㄓ','ㄔ','ㄗ']],['吃飯','ㄔ',['ㄔ','ㄕ','ㄘ']],['獅子','ㄕ',['ㄕ','ㄙ','ㄖ']],['熱狗','ㄖ',['ㄖ','ㄌ','ㄕ']]]},
 {name:'玩具城堡',questions:[['早安','ㄗ',['ㄗ','ㄓ','ㄘ']],['草莓','ㄘ',['ㄘ','ㄔ','ㄙ']],['蘇打','ㄙ',['ㄙ','ㄕ','ㄗ']],['彩虹','ㄘ',['ㄘ','ㄑ','ㄗ']]]},
 {name:'魔法鏡房',questions:[['衣服','ㄧ',['ㄧ','ㄨ','ㄩ']],['烏龜','ㄨ',['ㄧ','ㄨ','ㄩ']],['雨傘','ㄩ',['ㄩ','ㄨ','ㄧ']],['醫生','ㄧ',['ㄧ','ㄩ','ㄨ']]]},
 {name:'糖果湖畔',questions:[['阿姨','ㄚ',['ㄚ','ㄛ','ㄜ']],['河馬','ㄜ',['ㄛ','ㄜ','ㄝ']],['鵝','ㄜ',['ㄜ','ㄚ','ㄞ']],['愛心','ㄞ',['ㄞ','ㄟ','ㄠ']]]},
 {name:'閃亮舞台',questions:[['櫻桃','ㄧ',['ㄧ','ㄨ','ㄩ']],['蝸牛','ㄍ',['ㄍ','ㄎ','ㄏ']],['月亮','ㄩ',['ㄩ','ㄨ','ㄧ']],['眼睛','ㄧ',['ㄧ','ㄩ','ㄨ']]]},
 {name:'夢想寶庫',questions:[['天空','ㄊ',['ㄊ','ㄉ','ㄋ']],['花園','ㄏ',['ㄏ','ㄈ','ㄒ']],['學校','ㄒ',['ㄒ','ㄑ','ㄕ']],['朋友','ㄆ',['ㄆ','ㄅ','ㄈ']]]}
];
const rewards=[
 {icon:'👕',name:'莓果紫上衣',type:'outfit',value:'#71338f'}, {icon:'👚',name:'櫻花粉上衣',type:'outfit',value:'#ff76ad'},
 {icon:'👗',name:'紫色小裙子',type:'skirt',value:'#8b5cf6'}, {icon:'🩰',name:'粉色小裙子',type:'skirt',value:'#ff88b7'},
 {icon:'🎀',name:'蝴蝶結髮夾',type:'clip',value:'🎀'}, {icon:'🌟',name:'星星髮夾',type:'clip',value:'🌟'},
 {icon:'🪞',name:'魔法鏡子',type:'held',value:'🪞'}, {icon:'🧸',name:'黑色小熊',type:'held',value:'🧸'},
 {icon:'🪀',name:'閃亮溜溜球',type:'held',value:'🪀'}, {icon:'👑',name:'注音小皇冠',type:'clip',value:'👑'}
];
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
let unlocked=Math.min(10,Number(localStorage.getItem('kuromiZhuyinSimpleLevel')||0));
let stars=Number(localStorage.getItem('kuromiZhuyinSimpleStars')||0),currentLevel=Math.min(unlocked,9),round=0,correct=0,current=null,locked=false;
let wearing=JSON.parse(localStorage.getItem('kuromiZhuyinSimpleWearing')||'{}');
function save(){localStorage.setItem('kuromiZhuyinSimpleLevel',unlocked);localStorage.setItem('kuromiZhuyinSimpleStars',stars);localStorage.setItem('kuromiZhuyinSimpleWearing',JSON.stringify(wearing))}
53
const zhuyinVoice={'ㄅ':'玻','ㄆ':'坡','ㄇ':'摸','ㄈ':'佛','ㄉ':'得','ㄊ':'特','ㄋ':'呢','ㄌ':'勒','ㄍ':'哥','ㄎ':'科','ㄏ':'喝','ㄐ':'基','ㄑ':'欺','ㄒ':'希','ㄓ':'知','ㄔ':'吃','ㄕ':'詩','ㄖ':'日','ㄗ':'資','ㄘ':'疵','ㄙ':'絲','ㄧ':'衣','ㄨ':'烏','ㄩ':'迂','ㄚ':'阿','ㄛ':'喔','ㄜ':'鵝','ㄝ':'耶','ㄞ':'哀','ㄟ':'欸','ㄠ':'熬','ㄡ':'歐','ㄢ':'安','ㄣ':'恩','ㄤ':'昂','ㄥ':'亨','ㄦ':'兒'};
function speak(text){if(!('speechSynthesis' in window)){ $('instruction').textContent='這個瀏覽器不支援語音播放';return }speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zhuyinVoice[text]||text);u.lang='zh-TW';u.rate=.58;u.pitch=1.08;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/zh-TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;$('soundBtn').classList.add('playing');u.onend=()=>$('soundBtn').classList.remove('playing');u.onerror=()=>{$('soundBtn').classList.remove('playing');$('instruction').textContent='請再按一次喇叭播放注音'};speechSynthesis.speak(u)}
function renderLevels(){$('stars').textContent=stars;$('levels').innerHTML=levels.map((l,i)=>`<button class="level ${i<unlocked?'done':''} ${i===currentLevel?'current':''}" data-i="${i}" ${i>unlocked?'disabled':''}><b>${i<unlocked?'✓':i===currentLevel?'♠':'🔒'}</b>${i+1} 關</button>`).join('');document.querySelectorAll('.level:not(:disabled)').forEach(b=>b.onclick=()=>start(Number(b.dataset.i)))}
function renderCloset(){$('items').innerHTML=rewards.map((r,i)=>`<button class="item ${i<unlocked?'unlocked':''} ${wearing[r.type]===r.value?'wearing':''}" data-i="${i}" ${i>=unlocked?'disabled':''}><span><span class="icon">${i<unlocked?r.icon:'🔒'}</span>${i<unlocked?r.name:'神秘禮物'}</span></button>`).join('');document.querySelectorAll('.item.unlocked').forEach(b=>b.onclick=()=>wearItem(Number(b.dataset.i)));$('collectionText').textContent=unlocked?`已收集 ${unlocked} / 10 件禮物`:'尚未獲得禮物';applyLook()}
function wearItem(i){const r=rewards[i];wearing[r.type]=r.value;save();renderCloset();$('mood').textContent=`換上「${r.name}」真好看！`}
function applyLook(){$('body').style.setProperty('--outfit',wearing.outfit||'#4b2467');$('skirt').style.display=wearing.skirt?'block':'none';$('skirt').style.setProperty('--skirt',wearing.skirt||'#ff73ad');$('clip').style.display=wearing.clip?'block':'none';$('clip').textContent=wearing.clip||'';$('held').textContent=wearing.held||''}
function start(i=currentLevel){currentLevel=Math.min(i,9);round=0;correct=0;locked=false;$('reward').classList.remove('show');$('game').style.display='grid';$('startBtn').textContent=`重新挑戰第 ${currentLevel+1} 關`;$('levelTag').textContent=`第 ${currentLevel+1} 關・${levels[currentLevel].name}`;renderLevels();newQuestion();$('game').scrollIntoView({behavior:'smooth',block:'center'})}
function newQuestion(){locked=false;const qs=levels[currentLevel].questions;current=qs[(round+Math.floor(Math.random()*qs.length))%qs.length];$('instruction').textContent='按喇叭重複聽，再選一樣的注音';$('progress').textContent=`第 ${round+1} / 3 題・目前答對 ${correct} 題`;$('answers').innerHTML=shuffle(current[2]).map(x=>`<button class="answer" data-v="${x}">${x}</button>`).join('')+'<div class="feedback" id="feedback"></div>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b));setTimeout(()=>speak(current[1]),250)}
function answer(btn){if(locked)return;if(btn.dataset.v===current[1]){locked=true;btn.classList.add('correct');correct++;stars++;save();$('stars').textContent=stars;$('feedback').textContent=`答對了！你聽到的是 ${current[1]}`; $('feedback').className='feedback good';round++;if(round>=3)setTimeout(win,750);else setTimeout(newQuestion,850)}else{btn.classList.add('wrong');$('feedback').textContent='再聽一次，慢慢找就好！';$('feedback').className='feedback bad';setTimeout(()=>btn.classList.remove('wrong'),450);speak(current[1])}}
function win(){const wonIndex=currentLevel,r=rewards[wonIndex],isNew=wonIndex>=unlocked;if(isNew){unlocked=wonIndex+1;wearing[r.type]=r.value;save()}renderLevels();renderCloset();$('gift').textContent=r.icon;$('rewardTitle').textContent=`第 ${wonIndex+1} 關完成！`;$('rewardText').textContent=isNew?`獲得「${r.name}」，已經幫酷洛米穿戴上囉！`:`這關的禮物「${r.name}」已經在衣櫃裡囉！`;$('nextBtn').textContent=wonIndex===9?'再玩一次第 10 關 ↻':'前往下一關 →';$('reward').classList.add('show');$('answers').innerHTML='<div class="feedback good">🎉 太棒了，三題都完成！</div>';$('mood').textContent=wonIndex===9?'十關全部完成，你是注音魔法師！':'收到新禮物，好開心！';$('reward').scrollIntoView({behavior:'smooth',block:'center'})}
$('soundBtn').onclick=()=>current&&speak(current[1]);$('startBtn').onclick=()=>start(currentLevel);$('nextBtn').onclick=()=>start(Math.min(currentLevel+1,9));$('resetBtn').onclick=()=>{if(confirm('要清除所有關卡、星星和禮物，重新開始嗎？')){unlocked=stars=currentLevel=0;wearing={};save();renderLevels();renderCloset();$('mood').textContent='今天也要酷酷地學注音！';$('startBtn').textContent='開始第 1 關 →';$('answers').innerHTML='<div class="feedback">準備好就按「開始第 1 關」吧！</div>';$('reward').classList.remove('show')}};
renderLevels();renderCloset();if(unlocked>=10)currentLevel=9;renderLevels();
</script>
</body>
</html>
