<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷洛米注音遊戲</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#38213e;background:linear-gradient(145deg,#fff6ec,#eee5ff)}main{width:min(820px,100%);background:#ffffffed;border:2px solid white;border-radius:30px;padding:clamp(25px,6vw,50px);box-shadow:0 18px 50px #4c1d9525;text-align:center}h1{font-size:clamp(30px,6vw,48px);margin:0 0 10px}p{color:#735f79;line-height:1.8}.games{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.game{display:block;text-decoration:none;color:inherit;border:3px solid #dfcef1;border-radius:22px;padding:25px 18px;background:#fff;transition:.18s}.game:hover{transform:translateY(-4px);border-color:#8b5cf6;box-shadow:0 10px 22px #7c3aed20}.icon{font-size:52px}.game h2{margin:10px 0 5px}.game p{font-size:14px;margin:0}.easy{background:#fff6fb}.med{background:#f7f2ff}@media(max-width:620px){.games{grid-template-columns:1fr}}
  </style>
</head>
<body><main><h1>♠ 酷洛米注音魔法屋</h1><p>請選擇適合的學習難度</p><div class="games"><a class="game easy" href="./kruomi_zhuyin_game_easy/"><div class="icon">🔊</div><h2>簡易版</h2><p>直接聽「ㄅ」，選出「ㄅ」</p></a><a class="game med" href="./kruomi_zhuyin_game_med/"><div class="icon">🎧</div><h2>進階版</h2><p>聽「爸爸」，選出開頭的「ㄅ」</p></a></div></main></body>
</html>
